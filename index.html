<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>魔方图论模拟器</title>
  <meta name="description" content="把魔方画成一张图：节点是贴纸，圆环是层，每一次转动都是圆环上的一次置换。支持 2–7 阶，附新手引导教学，高帧率 Canvas 动画，零依赖。">
  <meta name="theme-color" content="#F3F0E8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg fill='none' stroke='%23A69F95' stroke-width='3'%3E%3Ccircle cx='32' cy='24' r='17'/%3E%3Ccircle cx='23' cy='39' r='17'/%3E%3Ccircle cx='41' cy='39' r='17'/%3E%3C/g%3E%3Ccircle cx='32' cy='14' r='5' fill='%23FCB43C' stroke='%233C342D' stroke-width='2'/%3E%3Ccircle cx='14' cy='45' r='5' fill='%232C6749' stroke='%233C342D' stroke-width='2'/%3E%3Ccircle cx='50' cy='45' r='5' fill='%23F88B30' stroke='%233C342D' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1 data-i18n-html="h1">魔方 <span class="dot">·</span> 图论模拟器</h1>
        <p id="subtitle">54 个节点是贴纸，9 个圆环是层——每一次转动，都只是圆环上的一次置换。</p>
      </div>
      <div class="top-right">
        <div class="order" role="group" data-i18n-attr="aria-label:order.aria">
          <span class="order-label" data-i18n="order.label">阶数</span>
          <div class="seg" id="orderPicker">
            <button type="button" data-n="2" aria-pressed="false">2</button>
            <button type="button" data-n="3" aria-pressed="true">3</button>
            <button type="button" data-n="4" aria-pressed="false">4</button>
            <button type="button" data-n="5" aria-pressed="false">5</button>
            <button type="button" data-n="6" aria-pressed="false">6</button>
            <button type="button" data-n="7" aria-pressed="false">7</button>
          </div>
        </div>
        <div class="seg lang" id="langPicker" role="group" data-i18n-attr="aria-label:lang.aria">
          <button type="button" data-lang="zh" aria-pressed="true" lang="zh-CN">中</button>
          <button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button>
        </div>
        <div class="meters" data-i18n-attr="title:meters.title">
          <span class="meter"><b id="fps">—</b><small>FPS</small></span>
          <span class="meter"><b id="ftime">—</b><small data-i18n="meter.frame">ms / 帧</small></span>
        </div>
      </div>
    </header>

    <main class="stage" id="stage">
      <section class="panel cube-panel">
        <canvas id="cube3d" role="img" data-i18n-attr="aria-label:aria.3d"></canvas>
        <div class="caption" data-i18n="cap.3d">拖动旋转视角 · 双击复位</div>
      </section>
      <section class="panel graph-panel">
        <canvas id="graph" role="img" data-i18n-attr="aria-label:aria.graph"></canvas>
        <div class="caption" id="hint">点击节点转动它所在的面 · 点击圆环转动这一层 · 拖动节点沿圆环转动 · Shift / 右键反向</div>
      </section>
    </main>

    <section class="controls">
      <div class="toolbar">
        <div class="btn-row">
          <button id="btnTutor" class="btn accent" type="button" aria-pressed="false" data-i18n="btn.tutor" data-i18n-attr="title:btn.tutor.title">新手教学</button>
          <span class="sep"></span>
          <button id="btnScramble" class="btn primary" type="button" data-i18n="btn.scramble">打乱</button>
          <button id="btnSolve" class="btn" type="button" data-i18n="btn.solve" data-i18n-attr="title:btn.solve.title">还原</button>
          <button id="btnDemo" class="btn" type="button" data-i18n="btn.demo" data-i18n-attr="title:btn.demo.title">演示</button>
          <span class="sep"></span>
          <button id="btnUndo" class="btn" type="button" title="Ctrl/⌘ + Z" data-i18n="btn.undo">撤销</button>
          <button id="btnRedo" class="btn" type="button" title="Ctrl/⌘ + Shift + Z" data-i18n="btn.redo">重做</button>
          <button id="btnReset" class="btn ghost" type="button" data-i18n="btn.reset">重置</button>
        </div>
        <label class="speed">
          <span data-i18n="speed">速度</span>
          <input id="speed" type="range" min="0" max="100" value="50" data-i18n-attr="aria-label:speed.aria">
          <output id="speedOut">300 ms</output>
        </label>
        <div class="toggles">
          <label><input type="checkbox" id="optTrails" checked><span data-i18n="opt.trails">拖尾</span></label>
          <label><input type="checkbox" id="optLabels" checked><span data-i18n="opt.labels">层名</span></label>
          <label><input type="checkbox" id="optNames"><span data-i18n="opt.names">贴纸编号</span></label>
          <label><input type="checkbox" id="opt3d" checked><span data-i18n="opt.3d">3D 视图</span></label>
        </div>
        <div class="status"><span id="stateText">已还原</span><span class="muted"> · </span><span id="moveCount">0</span><span class="muted" id="moveUnit"> 步</span></div>
      </div>

      <div class="movepad" id="movepad"></div>

      <div class="lab">
        <div class="lab-row">
          <input id="algo" type="text" spellcheck="false" autocomplete="off" data-i18n-attr="placeholder:algo.placeholder;aria-label:algo.aria">
          <select id="preset" data-i18n-attr="aria-label:preset.aria"><option value="">经典公式…</option></select>
          <button id="btnPlay" class="btn" type="button" data-i18n="btn.play">执行</button>
          <button id="btnPlayInv" class="btn" type="button" data-i18n="btn.playInv">执行逆</button>
          <button id="btnRepeat" class="btn" type="button" disabled>重复至复原</button>
          <label class="inline-toggle"><input type="checkbox" id="optArrows"><span data-i18n="opt.arrows">置换箭头</span></label>
        </div>
        <div class="lab-info" id="analysis"></div>
      </div>

      <div class="history" id="history" data-i18n-attr="aria-label:history.aria"></div>
    </section>

    <section class="explain">
      <h2 data-i18n="explain.h2">这张图是怎么来的</h2>
      <div class="cols">
        <div>
          <h3 data-i18n="explain.c1.h">圆环 = 层</h3>
          <p data-i18n-html="explain.c1.p"></p>
        </div>
        <div>
          <h3 data-i18n="explain.c2.h">节点 = 贴纸</h3>
          <p data-i18n-html="explain.c2.p"></p>
        </div>
        <div>
          <h3 data-i18n="explain.c3.h">转动 = 置换</h3>
          <p data-i18n-html="explain.c3.p"></p>
        </div>
      </div>
      <div class="keys">
        <h3 data-i18n="keys.h">键盘</h3>
        <p data-i18n-html="keys.p"></p>
      </div>
    </section>

    <footer class="foot">
      <span data-i18n-html="foot.inspired"></span>
      <span data-i18n-html="foot.meta"></span>
    </footer>
  </div>

  <aside class="coach" id="coach" hidden aria-live="polite" data-i18n-attr="aria-label:coach.aria">
    <div class="coach-head">
      <div class="coach-chapters" id="coachChapters"></div>
      <button class="coach-close" id="coachClose" type="button" data-i18n-attr="aria-label:coach.close;title:coach.close">×</button>
    </div>
    <div class="coach-body">
      <div class="coach-main">
        <h3 id="coachTitle"></h3>
        <p id="coachText"></p>
        <div class="coach-moves" id="coachMoves"></div>
        <div class="coach-hint" id="coachHint"></div>
      </div>
      <div class="coach-actions">
        <button id="coachPrimary" class="btn primary" type="button"></button>
        <button id="coachSecondary" class="btn" type="button"></button>
        <div class="coach-feedback" id="coachFeedback"></div>
      </div>
    </div>
  </aside>

  <script src="js/i18n.js"></script>
  <script src="js/cube.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/solver.js"></script>
  <script src="js/graph-view.js"></script>
  <script src="js/cube3d-view.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
